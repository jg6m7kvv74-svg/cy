<body class="font-sans text-neutral-800 bg-gradient-to-br from-primary/10 via-white to-secondary/10 min-h-screen flex items-center justify-center px-4">

    <!-- Gemly AI 触发按钮 -->
    <button id="openGemlyAiBtn" class="agent-fab" aria-label="Chat with Crystal Soul" title="与Crystal Soul（晶灵）对话">

    <!-- ============ Gemly AI 对话抽屉组件（自研樱花粉白主题·不嵌入任何第三方页面） ============ -->
    <aside id="gemlyDrawer" class="gemly-drawer" aria-hidden="true" role="dialog" aria-label="Gemly AI Crystal Advisor">
        <!-- 顶部标题栏 60px -->
        <header class="gemly-header">

                <span class="gemly-header-icon"><i class="fa fa-gem"></i></span>

            <button id="gemlySendBtn" class="gemly-send-btn" aria-label="发送"><i class="fa fa-paper-plane"></i></button>
        </footer>
    </aside>
    <!-- 抽屉遮罩(仅移动端点击关闭,PC端透明不阻挡主体浏览) -->
    <div id="gemlyDrawerBackdrop" class="gemly-drawer-backdrop" aria-hidden="true"></div>

    <style>
        /* === Gemly AI 樱花粉白主题 === */
        .gemly-drawer {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 420px; max-width: 100vw; height: 100vh;
            background: #FFF8FA;            /* 粉白底色 */
            z-index: 10000;
            transform: translateX(100%);
            display: flex; flex-direction: column;
            box-shadow: -12px 0 40px rgba(255, 182, 193, 0.22);
            will-change: transform;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .gemly-drawer.open { transform: translateX(0); }

        /* 顶部标题栏 60px */
        .gemly-header {
            height: 60px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 0 16px;
            background: linear-gradient(180deg, #FFF0F5 0%, #FFE6EF 100%);
            border-bottom: 1px solid #FFE0EC;
        }
        .gemly-header-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .gemly-header-icon {
            width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #FFD1DC 0%, #FFB6C1 100%);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 14px;
            box-shadow: 0 4px 12px rgba(255, 209, 220, 0.5);
        }
        .gemly-header-title { font-size: 14px; font-weight: 600; color: #222222; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gemly-header-sub { font-size: 11px; color: #8a7079; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gemly-header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .gemly-icon-btn {
            width: 32px; height: 32px; border-radius: 10px;
            display: inline-flex; align-items: center; justify-content: center;
            color: #8a7079; background: transparent; border: none; cursor: pointer; font-size: 15px;
            transition: background .2s ease, color .2s ease;
        }
        .gemly-icon-btn:hover { background: #FFD1DC; color: #fff; }

        /* 对话滚动区 */
        .gemly-chat-body {
            flex: 1 1 0%; min-height: 0; overflow-y: auto; overflow-x: hidden;
            padding: 18px 16px; display: flex; flex-direction: column; gap: 16px;
        }
        .gemly-chat-body::-webkit-scrollbar { width: 6px; }
        .gemly-chat-body::-webkit-scrollbar-thumb { background: #FFD1DC; border-radius: 6px; }
        .gemly-chat-body::-webkit-scrollbar-track { background: transparent; }

        /* 消息行 */
        .gemly-msg { display: flex; gap: 8px; max-width: 92%; }
        .gemly-msg-ai { align-self: flex-start; }
        .gemly-msg-user { align-self: flex-end; flex-direction: row-reverse; }

        /* 头像 */
        .gemly-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .gemly-avatar-ai { background: linear-gradient(135deg, #FFD1DC 0%, #FFB6C1 100%); color: #fff; box-shadow: 0 2px 8px rgba(255, 209, 220, 0.5); }
        .gemly-avatar-user { background: #fff; color: #FFB6C1; border: 1.5px solid #FFD1DC; }

        /* 气泡 */
        .gemly-bubble { padding: 10px 14px; font-size: 13.5px; line-height: 1.6; word-break: break-word; }
        .gemly-bubble-ai { background: #FFFFFF; color: #444444; border: 1px solid #FFE0EC; border-radius: 4px 14px 14px 14px; box-shadow: 0 2px 10px rgba(255, 182, 193, 0.1); }
        .gemly-bubble-user { background: #FFD1DC; color: #5a3a42; border-radius: 14px 4px 14px 14px; box-shadow: 0 2px 10px rgba(255, 209, 220, 0.35); }

        /* loading 三点动画 */
        .gemly-typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
        .gemly-typing span { width: 7px; height: 7px; border-radius: 50%; background: #FFB6C1; animation: gemlyBlink 1.2s infinite ease-in-out both; }
        .gemly-typing span:nth-child(2) { animation-delay: .2s; }
        .gemly-typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes gemlyBlink { 0%, 80%, 100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

        /* 底部输入栏 72px */
        .gemly-input-bar {
            height: 72px; flex-shrink: 0; padding: 12px 14px;
            display: flex; align-items: center; gap: 10px;
            background: #FFFFFF; border-top: 1px solid #FFE0EC;
        }
        .gemly-input {
            flex: 1; height: 44px; border-radius: 22px; border: 1.5px solid #FFE0EC;
            padding: 0 18px; font-size: 14px; color: #444444; background: #FFF8FA;
            outline: none; transition: border-color .2s ease, box-shadow .2s ease;
        }
        .gemly-input::placeholder { color: #c9a8b2; }
        .gemly-input:focus { border-color: #FFD1DC; box-shadow: 0 0 0 3px rgba(255, 209, 220, 0.25); background: #fff; }
        .gemly-send-btn {
            width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #FFD1DC 0%, #FFB6C1 100%); color: #fff;
            border: none; cursor: pointer; font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(255, 209, 220, 0.5);
            transition: transform .2s ease, opacity .2s ease;
        }
        .gemly-send-btn:hover { transform: scale(1.08); }
        .gemly-send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        /* 遮罩:PC透明不阻挡,移动端半透明可点击关闭 */
        .gemly-drawer-backdrop { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0); pointer-events: none; transition: background .35s ease; }
        .gemly-drawer-backdrop.show { background: rgba(34, 34, 34, 0.25); }
        @media (max-width: 640px) {
            .gemly-drawer { width: 100vw; }
            .gemly-drawer-backdrop.show { background: rgba(34, 34, 34, 0.4); pointer-events: auto; }
        }
        .agent-fab.drawer-active { transform: scale(.92); opacity: .8; }
    </style>

    <script>
    /* === Gemly AI 对话抽屉逻辑(自执行,不污染全局) === */
    (function () {
        /* ========= 配置区(上线前必读) ========= */
        // ① 演示模式开关：true=本地模拟回复(仅调试用,禁止上线)；false=走后端代理调用真实AI
        //    ⚠️ 上线前必须改为 false,否则用户收到的都是模拟文案,且无法对接智能体
        var GEMLY_DEMO_MODE = true;

        // ② 后端代理接口地址(演示模式关闭后生效)
        //    ⚠️ ①需要后端实现的代理接口地址位置：该接口由你的后端服务实现,
        //       后端在此接口内携带 Coze PAT 令牌 + agent_id 转发请求到 Coze 开放API,
        //       响应需返回 JSON: { "reply": "AI回复文本" }
        //    请求体示例(前端发给后端): { "agent_id": "...", "message": "用户输入", "history": [...] }
        var GEMLY_PROXY_URL = '/api/gemly-chat';

        // ③ Coze agent_id(智能体ID,可放前端；PAT个人访问令牌严禁写前端,只能放后端)
        //    ⚠️ ②需要填写的Coze agent_id：在Coze平台智能体详情页获取,填入下方引号内
        var GEMLY_AGENT_ID = '';
        /* ========= 配置区结束 ========= */

        var drawer = document.getElementById('gemlyDrawer');
        var backdrop = document.getElementById('gemlyDrawerBackdrop');
        var openBtn = document.getElementById('openGemlyAiBtn');
        var closeBtn = document.getElementById('gemlyDrawerClose');
        var hideBtn = document.getElementById('gemlyDrawerHide');
        var chatBody = document.getElementById('gemlyChatBody');
        var input = document.getElementById('gemlyInput');
        var sendBtn = document.getElementById('gemlySendBtn');
        if (!drawer || !openBtn || !chatBody) return;

        var animTimer = null;
        var isSending = false;
        var history = []; // 对话历史仅存内存,刷新清空

        /* --- 滑入滑出动画(JS驱动,规避部分环境 transition 失效) --- */
        function slide(toOpen) {
            if (animTimer) { clearTimeout(animTimer); animTimer = null; }
            var width = drawer.offsetWidth;
            var t = drawer.style.transform || '';
            var m = t.match(/translateX\(([-\d.]+)px\)/);
            var start = m ? parseFloat(m[1]) : (toOpen ? width : 0);
            var end = toOpen ? 0 : width;
            drawer.style.transform = 'translateX(' + start + 'px)';
            var duration = 350, t0 = Date.now();
            function ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
            (function step() {
                var p = Math.min((Date.now() - t0) / duration, 1);
                drawer.style.transform = 'translateX(' + (start + (end - start) * ease(p)) + 'px)';
                if (p < 1) { animTimer = setTimeout(step, 16); }
                else { drawer.style.transform = ''; animTimer = null; }
            })();
        }
        function openDrawer() {
            drawer.classList.add('open');
            drawer.setAttribute('aria-hidden', 'false');
            backdrop.classList.add('show');
            openBtn.classList.add('drawer-active');
            document.body.style.overflow = 'hidden';
            slide(true);
            if (!chatBody.hasChildNodes()) addAiMessage('Hi, I\'m Crystal Soul 💎 Your sanctuary for crystal healing & pet companionship. How may I guide your journey today?');
            setTimeout(function () { input && input.focus(); }, 360);
        }
        function closeDrawer() {
            drawer.classList.remove('open');
            drawer.setAttribute('aria-hidden', 'true');
            backdrop.classList.remove('show');
            openBtn.classList.remove('drawer-active');
            document.body.style.overflow = '';
            slide(false);
        }
        openBtn.addEventListener('click', openDrawer);
        if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
        if (hideBtn) hideBtn.addEventListener('click', closeDrawer);
        if (backdrop) backdrop.addEventListener('click', closeDrawer);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
        });

        /* --- 消息渲染 --- */
        function scrollBottom() { chatBody.scrollTop = chatBody.scrollHeight; }
        function addUserMessage(text) {
            var row = document.createElement('div');
            row.className = 'gemly-msg gemly-msg-user';
            row.innerHTML = '<div class="gemly-avatar gemly-avatar-user"><i class="fa fa-user"></i></div><div class="gemly-bubble gemly-bubble-user"></div>';
            row.querySelector('.gemly-bubble').textContent = text;
            chatBody.appendChild(row);
            scrollBottom();
        }
        function addAiMessage(text) {
            var row = document.createElement('div');
            row.className = 'gemly-msg gemly-msg-ai';
            row.innerHTML = '<div class="gemly-avatar gemly-avatar-ai"><i class="fa fa-gem"></i></div><div class="gemly-bubble gemly-bubble-ai"></div>';
            row.querySelector('.gemly-bubble').textContent = text;
            chatBody.appendChild(row);
            scrollBottom();
        }
        function showTyping() {
            var row = document.createElement('div');
            row.className = 'gemly-msg gemly-msg-ai gemly-typing-row';
            row.innerHTML = '<div class="gemly-avatar gemly-avatar-ai"><i class="fa fa-gem"></i></div><div class="gemly-bubble gemly-bubble-ai"><span class="gemly-typing"><span></span><span></span><span></span></span></div>';
            chatBody.appendChild(row);
            scrollBottom();
            return row;
        }

        /* --- 发送 --- */
        function send() {
            var text = (input.value || '').trim();
            if (!text || isSending) return;
            isSending = true;
            sendBtn.disabled = true;
            input.value = '';
            addUserMessage(text);
            history.push({ role: 'user', content: text });
            var typing = showTyping();

            if (GEMLY_DEMO_MODE) {
                // ⚠️ 演示模式:本地模拟回复,仅本地调试用,禁止上线
                var replies = [
                    'Crystals carry ancient calm. Amethyst soothes anxiety, while rose quartz opens the heart. Which energy calls to you?',
                    'For your pet companion, try placing a gentle rose quartz near their resting spot — it radiates love and safety.',
                    'Every LuminaGems piece is ethically sourced and energy-cleansed. Your crystal chooses you as much as you choose it.',
                    'Take a deep breath. Hold your crystal, set an intention, and let its frequency align with yours.',
                    'Crystal Soul is here for you. Tell me more about what your heart or your pet needs today.'
                ];
                setTimeout(function () {
                    typing.remove();
                    var r = replies[Math.floor(Math.random() * replies.length)];
                    addAiMessage(r);
                    history.push({ role: 'assistant', content: r });
                    isSending = false;
                    sendBtn.disabled = false;
                    input.focus();
                }, 900 + Math.random() * 700);
            } else {
                // 真实模式:调用后端代理接口(后端携带PAT令牌转发到Coze API)
                fetch(GEMLY_PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_id: GEMLY_AGENT_ID, message: text, history: history })
                }).then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                }).then(function (data) {
                    typing.remove();
                    var reply = (data && data.reply) ? data.reply : 'Sorry, Crystal Soul is resting. Please try again later.';
                    addAiMessage(reply);
                    history.push({ role: 'assistant', content: reply });
                }).catch(function (err) {
                    typing.remove();
                    addAiMessage('Network hiccup — please check your connection and try again. ✨');
                }).then(function () {
                    isSending = false;
                    sendBtn.disabled = false;
                    input.focus();
                });
            }
        }
        if (sendBtn) sendBtn.addEventListener('click', send);
        if (input) input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
    })();
    </script>
    <!-- ============ /Gemly AI 对话抽屉组件 ============ -->
</body>
</html>
